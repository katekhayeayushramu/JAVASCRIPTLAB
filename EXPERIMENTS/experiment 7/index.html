<!DOCTYPE html>
<html>
<head>
    <title>DOM Traversal and Updates</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .student-info {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="text"] {
            width: 60%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .editInput {
            flex: 1;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add {
            background-color: green;
            color: white;
        }

        .edit {
            background-color: orange;
            color: white;
        }

        .save {
            background-color: blue;
            color: white;
        }

        .delete {
            background-color: red;
            color: white;
        }

        li {
            list-style: none;
            background-color: #eee;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;

            display: flex;
            align-items: center;
            gap: 5px;
        }

        .task {
            flex: 1;
            text-align: left;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>My To-Do List</h2>

    <div class="student-info">
        <p><strong>Name:</strong> Ayush Katekhaye</p>
        <p><strong>PRN:</strong> 24070521161</p>
    </div>

    <input type="text" id="taskInput" placeholder="Enter a task">

    <button class="add" onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

</div>

<script>

function addTask() {

    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task!");
        return;
    }

    // Create list item
    let li = document.createElement("li");

    // CHECKBOX FIRST
    let checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    // Create task text
    let taskText = document.createElement("span");
    taskText.textContent = task;
    taskText.className = "task";

    // Create Edit button
    let editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.className = "edit";

    // Create Delete button
    let deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "delete";


    // CHECKBOX FUNCTION
    checkbox.onclick = function () {

        let parent = this.parentElement;

        let text = parent.querySelector(".task");

        text.classList.toggle("completed");
    };


    // EDIT FUNCTION
    editButton.onclick = function () {

        // DOM Traversal
        let parent = this.parentElement;

        // Find current task
        let text = parent.querySelector(".task");

        // Create input box
        let editInput = document.createElement("input");

        editInput.type = "text";
        editInput.value = text.textContent;
        editInput.className = "editInput";

        // Create Save button
        let saveButton = document.createElement("button");

        saveButton.textContent = "Save";
        saveButton.className = "save";

        // Replace task text with input box
        parent.replaceChild(editInput, text);

        // Replace Edit button with Save button
        parent.replaceChild(saveButton, editButton);


        // SAVE FUNCTION
        saveButton.onclick = function () {

            let newTask = editInput.value.trim();

            if (newTask === "") {
                alert("Task cannot be empty!");
                return;
            }

            // Create new task text
            let newText = document.createElement("span");

            newText.textContent = newTask;
            newText.className = "task";

            // Replace input with updated text
            parent.replaceChild(newText, editInput);

            // Replace Save button with Edit button
            parent.replaceChild(editButton, saveButton);
        };
    };


    // DELETE FUNCTION
    deleteButton.onclick = function () {

        // DOM Traversal
        let parent = this.parentElement;

        // Remove task
        parent.remove();
    };


    // Add elements in order
    // CHECKBOX FIRST
    li.appendChild(checkbox);
    li.appendChild(taskText);
    li.appendChild(editButton);
    li.appendChild(deleteButton);


    // Add task to list
    document.getElementById("taskList").appendChild(li);

    // Clear input
    input.value = "";
}

</script>

</body>
</html>
