<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grading System</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>🎓 Student Grading System</h1>

<label>Student Name</label>
<input type="text" id="name" placeholder="Enter Student Name">

<label>Student PRN</label>
<input type="text" id="prn" placeholder="Enter Student PRN">

<label>English</label>
<input type="number" id="english" placeholder="Enter English Marks">

<label>Mathematics</label>
<input type="number" id="maths" placeholder="Enter Mathematics Marks">

<label>Science</label>
<input type="number" id="science" placeholder="Enter Science Marks">

<label>Computer</label>
<input type="number" id="computer" placeholder="Enter Computer Marks">

<label>History</label>
<input type="number" id="history" placeholder="Enter History Marks">

<button onclick="calculateGrade()">
Calculate Result
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
