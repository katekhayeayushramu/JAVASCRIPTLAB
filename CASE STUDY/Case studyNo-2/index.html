<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green Basket - Online Vegetable Shopping</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>🥬 Green Basket</h1>
    <h2>Ayush Katehaye</h2>
    <h2>24070521161</h2>

    <p>Fresh Vegetables Delivered to Your Doorstep</p>

</header>

<nav>

    <a href="#">Home</a>
    <a href="#">Vegetables</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>

</nav>

<div class="container">

<h2>Fresh Vegetables</h2>

<div class="products">

<div class="product">

<img src="images/tomato.jpg" alt="Tomato">

<h3>Tomato</h3>

<p>₹40 / Kg</p>

</div>

<div class="product">

<img src="images/potato.jpg" alt="Potato">

<h3>Potato</h3>

<p>₹30 / Kg</p>

</div>

<div class="product">

<img src="images/onion.jpg" alt="Onion">

<h3>Onion</h3>

<p>₹35 / Kg</p>

</div>

</div>

<hr>

<h2>Customer Billing</h2>

<form>

<label>Customer Name</label>

<input type="text" id="name">

<label>Mobile Number</label>

<input type="tel" id="mobile">

<label>Invoice Number</label>

<input type="text" id="invoice">

<label>Select Product</label>

<select id="product">

<option value="Tomato">Tomato</option>

<option value="Potato">Potato</option>

<option value="Onion">Onion</option>

</select>

<label>Quantity (Kg)</label>

<input type="number" id="qty">

<label>Rate per Kg (₹)</label>

<input type="number" id="rate" readonly>

<label>Discount (%)</label>

<input type="number" id="discount">

<label>GST (%)</label>

<input type="number" id="gst">

<label>Packing Charges (₹)</label>

<input type="number" id="packing">

<label>Payment Mode</label>

<select id="payment">

<option>Cash</option>

<option>Card</option>

<option>UPI</option>

</select>

<label>Membership</label>

<select id="member">

<option>Yes</option>

<option>No</option>

</select>

<button type="button" onclick="calculateBill()">

Calculate Bill

</button>

</form>

<div id="bill"></div>

</div>

<footer>

<p>© 2026 Green Basket | Fresh Vegetable Shopping</p>

</footer>

<script src="script.js"></script>

</body>

</html>
