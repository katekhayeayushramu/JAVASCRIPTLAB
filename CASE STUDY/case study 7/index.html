<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Event Handling</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        /* Main Form */

        .container {
            width: 650px;
            max-width: 100%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            animation: slideUp 0.8s ease;
        }


        /* Animation */

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* Heading */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;

            font-size: 30px;

            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #777;
            margin-top: 8px;
        }


        /* Form Group */

        .form-group {
            margin-bottom: 20px;

            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }


        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #333;
        }


        /* Input */

        input,
        select,
        textarea {

            width: 100%;

            padding: 13px;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            transition: 0.3s;
        }


        /* Focus Event Animation */

        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: #667eea;

            box-shadow:
                0 0 0 4px rgba(102, 126, 234, 0.15);

            transform: scale(1.02);
        }


        textarea {

            height: 110px;

            resize: vertical;
        }


        /* Gender */

        .gender {

            display: flex;

            gap: 25px;
        }

        .gender label {

            font-weight: normal;

            display: flex;

            align-items: center;

            gap: 6px;
        }

        .gender input {

            width: auto;
        }


        /* Error */

        .error {

            color: #e53935;

            font-size: 13px;

            margin-top: 5px;

            min-height: 16px;
        }


        .error-animation {

            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }

        }


        /* Buttons */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 10px;
        }


        button {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .submit-btn {

            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2
            );

            color: white;
        }


        .reset-btn {

            background: #eeeeee;

            color: #333;
        }


        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 15px rgba(0, 0, 0, 0.15);
        }


        button:active {

            transform: scale(0.97);
        }


        /* Event Message */

        #eventMessage {

            text-align: center;

            margin-top: 18px;

            color: #666;

            font-size: 14px;

            transition: 0.3s;
        }


        /* Success */

        .success {

            display: none;

            margin-top: 20px;

            padding: 18px;

            text-align: center;

            border-radius: 10px;

            background: #e8f5e9;

            color: #2e7d32;

            font-weight: bold;
        }


        .success.show {

            display: block;

            animation: successAnimation 0.6s ease;
        }


        @keyframes successAnimation {

            0% {

                opacity: 0;

                transform: scale(0.7);
            }

            70% {

                transform: scale(1.05);
            }

            100% {

                opacity: 1;

                transform: scale(1);
            }

        }


        /* Character Counter */

        .counter {

            text-align: right;

            font-size: 12px;

            color: #888;

            margin-top: 4px;
        }


        /* Footer */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #888;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- Header -->

    <div class="header">

        <h1>Student Registration</h1>

        <p>JavaScript Events & Form Validation</p>

    </div>


    <!-- Form -->

    <form id="registrationForm">


        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <div id="nameError" class="error"></div>

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="text"
                id="email"
                placeholder="example@gmail.com"
            >

            <div id="emailError" class="error"></div>

        </div>


        <!-- Mobile -->

        <div class="form-group">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
            >

            <div id="mobileError" class="error"></div>

        </div>


        <!-- Course -->

        <div class="form-group">

            <label for="course">
                Select Course
            </label>

            <select id="course">

                <option value="">
                    -- Select Course --
                </option>

                <option value="CSE">
                    Computer Science Engineering
                </option>

                <option value="IT">
                    Information Technology
                </option>

                <option value="ECE">
                    Electronics Engineering
                </option>

                <option value="ME">
                    Mechanical Engineering
                </option>

            </select>

            <div id="courseError" class="error"></div>

        </div>


        <!-- Gender -->

        <div class="form-group">

            <label>
                Gender
            </label>

            <div class="gender">

                <label>

                    <input
                        type="radio"
                        name="gender"
                        value="Male"
                    >

                    Male

                </label>


                <label>

                    <input
                        type="radio"
                        name="gender"
                        value="Female"
                    >

                    Female

                </label>

            </div>

            <div id="genderError" class="error"></div>

        </div>


        <!-- Address -->

        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                maxlength="150"
                placeholder="Enter your address"
            ></textarea>

            <div class="counter">

                <span id="count">0</span>/150 characters

            </div>

            <div id="addressError" class="error"></div>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                type="submit"
                class="submit-btn"
            >

                Submit Registration

            </button>


            <button
                type="reset"
                class="reset-btn"
            >

                Reset

            </button>

        </div>


        <!-- Event Message -->

        <p id="eventMessage">

            Fill the form to register.

        </p>


        <!-- Success Message -->

        <div id="successMessage" class="success">

            ✓ Registration Successful!

        </div>


    </form>


    <div class="footer">

        Experiment 7 - Events Handling in JavaScript

    </div>


</div>


<script>


    /* =====================================
       ACCESS FORM ELEMENTS
    ===================================== */

    let form =
        document.getElementById("registrationForm");

    let nameInput =
        document.getElementById("name");

    let emailInput =
        document.getElementById("email");

    let mobileInput =
        document.getElementById("mobile");

    let courseInput =
        document.getElementById("course");

    let addressInput =
        document.getElementById("address");


    /* =====================================
       FOCUS EVENT
    ===================================== */

    nameInput.addEventListener("focus", function() {

        document.getElementById("eventMessage").innerHTML =
            "✏️ Enter your full name.";

    });


    emailInput.addEventListener("focus", function() {

        document.getElementById("eventMessage").innerHTML =
            "📧 Enter a valid email address.";

    });


    mobileInput.addEventListener("focus", function() {

        document.getElementById("eventMessage").innerHTML =
            "📱 Enter your 10 digit mobile number.";

    });


    addressInput.addEventListener("focus", function() {

        document.getElementById("eventMessage").innerHTML =
            "🏠 Enter your complete address.";

    });


    /* =====================================
       CHANGE EVENT
    ===================================== */

    courseInput.addEventListener("change", function() {

        if (courseInput.value != "") {

            document.getElementById("eventMessage").innerHTML =
                "🎓 Selected Course: " +
                courseInput.options[
                    courseInput.selectedIndex
                ].text;

        }

    });


    /* =====================================
       ADDRESS CHARACTER COUNTER
    ===================================== */

    addressInput.addEventListener("input", function() {

        document.getElementById("count").innerHTML =
            addressInput.value.length;

    });


    /* =====================================
       SUBMIT EVENT
    ===================================== */

    form.addEventListener("submit", function(event) {

        event.preventDefault();


        /* Clear Errors */

        document.getElementById("nameError").innerHTML = "";

        document.getElementById("emailError").innerHTML = "";

        document.getElementById("mobileError").innerHTML = "";

        document.getElementById("courseError").innerHTML = "";

        document.getElementById("genderError").innerHTML = "";

        document.getElementById("addressError").innerHTML = "";


        document.getElementById("successMessage")
            .classList.remove("show");


        let valid = true;


        /* Name Validation */

        if (nameInput.value.trim() == "") {

            document.getElementById("nameError").innerHTML =
                "⚠ Please enter your name.";

            valid = false;

        }


        /* Email Validation */

        let emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (emailInput.value.trim() == "") {

            document.getElementById("emailError").innerHTML =
                "⚠ Please enter your email.";

            valid = false;

        }

        else if (!emailPattern.test(emailInput.value)) {

            document.getElementById("emailError").innerHTML =
                "⚠ Please enter a valid email.";

            valid = false;

        }


        /* Mobile Validation */

        let mobilePattern =
            /^[0-9]{10}$/;


        if (mobileInput.value.trim() == "") {

            document.getElementById("mobileError").innerHTML =
                "⚠ Please enter your mobile number.";

            valid = false;

        }

        else if (!mobilePattern.test(mobileInput.value)) {

            document.getElementById("mobileError").innerHTML =
                "⚠ Mobile number must contain 10 digits.";

            valid = false;

        }


        /* Course Validation */

        if (courseInput.value == "") {

            document.getElementById("courseError").innerHTML =
                "⚠ Please select a course.";

            valid = false;

        }


        /* Gender Validation */

        let gender =
            document.querySelector(
                'input[name="gender"]:checked'
            );


        if (gender == null) {

            document.getElementById("genderError").innerHTML =
                "⚠ Please select your gender.";

            valid = false;

        }


        /* Address Validation */

        if (addressInput.value.trim() == "") {

            document.getElementById("addressError").innerHTML =
                "⚠ Please enter your address.";

            valid = false;

        }


        /* Final Result */

        if (valid) {

            document.getElementById("eventMessage").innerHTML =
                "🎉 All details are valid!";

            document.getElementById("successMessage")
                .classList.add("show");

        }

        else {

            document.getElementById("eventMessage").innerHTML =
                "❌ Please correct the errors.";

        }

    });


    /* =====================================
       RESET EVENT
    ===================================== */

    form.addEventListener("reset", function() {

        setTimeout(function() {

            document.getElementById("eventMessage").innerHTML =
                "🔄 Form has been reset.";

            document.getElementById("successMessage")
                .classList.remove("show");

            document.getElementById("count").innerHTML =
                "0";

        }, 10);

    });


</script>


</body>
</html>
